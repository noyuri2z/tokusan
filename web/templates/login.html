{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto">
    <section class="bg-white rounded-lg shadow p-8">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">ログイン</h2>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">ユーザー名</label>
                <input type="text" id="username" name="username" required
                       value="{{ username or '' }}"
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       placeholder="ユーザー名を入力">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">パスワード</label>
                <input type="password" id="password" name="password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                       placeholder="パスワードを入力">
            </div>
            <button type="submit"
                    class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition font-medium">
                ログイン
            </button>
        </form>

        <p class="mt-6 text-center text-sm text-gray-600">
            アカウントをお持ちでない方は
            <a href="/register" class="text-blue-600 hover:underline">新規登録</a>
        </p>
    </section>
</div>
{% endblock %}
