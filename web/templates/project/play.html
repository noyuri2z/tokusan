{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
    <!-- Progress Indicator -->
    {% include "partials/progress.html" %}

    <section class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold mb-2">テキスト分類</h2>
        <p class="text-sm text-gray-600 mb-6">分類してみたい文章やテキストを入力して分類してみましょう。AIがなぜ・どのように分類されたかを解説してくれます。</p>

        <form hx-post="/api/predict"
              hx-target="#result-section"
              hx-swap="innerHTML"
              class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    分類するテキストを入力
                </label>
                <textarea name="text" rows="4" required
                          placeholder="ここにテキストを入力してください..."
                          class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-purple-500 focus:border-purple-500"></textarea>
            </div>

            <button type="submit"
                    class="bg-purple-600 text-white px-6 py-2 rounded hover:bg-purple-700 transition inline-flex items-center">
                分類する
                <svg class="htmx-indicator ml-2 animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>
    </section>

    <!-- Prediction Results -->
    <div id="result-section"></div>

    <!-- Navigation -->
    <div class="flex justify-between items-center">
        <div class="space-x-4">
            <a href="/project/results" class="text-gray-600 hover:text-gray-800 text-sm">結果ページに戻る</a>
            <a href="/dashboard" class="text-gray-600 hover:text-gray-800 text-sm">ダッシュボードに戻る</a>
        </div>
    </div>
</div>
{% endblock %}
