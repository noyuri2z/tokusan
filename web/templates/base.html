<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tokusan - 日本語テキスト分類器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-indicator { display: none; }
        .htmx-request.htmx-indicator { display: inline-block; }
    </style>
    <script>
        document.addEventListener("htmx:beforeSwap", function(evt) {
            if (evt.detail.xhr.status >= 400) {
                evt.detail.shouldSwap = true;
                evt.detail.isError = false;
            }
        });
    </script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Tokusan テキスト分類器</h1>
            <p class="text-gray-600">AIによる説明付き日本語テキスト分類</p>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="mt-12 text-center text-gray-500 text-sm">
            <p>Powered by Tokusan</p>
        </footer>
    </div>
    <!-- Metric tooltip container (lives outside content div so it's never clipped) -->
    <div id="metric-tooltip"
         style="display:none;position:fixed;z-index:50;max-width:20rem;background:#fff;border:1px solid #e5e7eb;border-radius:0.5rem;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1);padding:1rem;font-size:0.875rem;color:#374151;pointer-events:none;">
    </div>

    <!-- Metric tooltip (event delegation — works for htmx-injected content) -->
    <script>
    (function () {
        var METRIC_INFO = {
            precision: {
                title: '適合率とは？',
                body: '抽出された情報の中で関連性の高い情報がどれくらいあったかの割合です。英語では Precision と呼ばれます。この値が高いということは偽陽性を減らせているという意味合いになります。\n\n例）フェイクニュースと本当のニュースを分類するモデルがあったとして、適合率とはモデルがフェイクと分類したニュースの中で実際にフェイクだったニュースがどれくらいあるかの割合となります。',
            },
            recall: {
                title: '再現率とは？',
                body: '関連性のある情報がどれくらい抽出されたかの割合を示しています。英語では Recall と呼ばれます。この値が高いということは偽陰性を減らせているという意味合いになります。\n\n例）フェイクニュースと本当のニュースを分類するモデルがあったとして、再現率とは全てのフェイクニュースの中でモデルがフェイクと分類することができたニュースがどれくらいあったかの割合を表しています。',
            },
            f1: {
                title: 'F1値とは？',
                body: 'それぞれのクラスに正しく分類されたデータの比率を表した値。適合率と再現率の値を組み合わせて計算された総合評価です。',
            },
        };

        var activeBtn = null;

        function getTooltip() {
            return document.getElementById('metric-tooltip');
        }

        function showTooltip(btn, metric) {
            var tooltip = getTooltip();
            if (!tooltip) return;
            var info = METRIC_INFO[metric];
            if (!info) return;

            tooltip.innerHTML =
                '<p style="font-weight:600;margin-bottom:0.25rem;">' + info.title + '</p>' +
                info.body.split('\n\n').map(function(p) {
                    return '<p style="margin-bottom:0.25rem;">' + p + '</p>';
                }).join('');

            tooltip.style.pointerEvents = 'auto';
            tooltip.style.display = 'block';

            var rect = btn.getBoundingClientRect();
            var top = rect.bottom + 6;
            var left = rect.left - 200;
            if (left < 8) left = 8;
            if (left + 320 > window.innerWidth) left = window.innerWidth - 328;

            tooltip.style.top = top + 'px';
            tooltip.style.left = left + 'px';
        }

        function hideTooltip() {
            var tooltip = getTooltip();
            if (tooltip) {
                tooltip.style.display = 'none';
                tooltip.style.pointerEvents = 'none';
            }
            activeBtn = null;
        }

        document.addEventListener('click', function (e) {
            var btn = e.target.closest('.metric-help-btn');
            if (btn) {
                e.stopPropagation();
                if (activeBtn === btn) {
                    hideTooltip();
                } else {
                    activeBtn = btn;
                    showTooltip(btn, btn.dataset.metric);
                }
                return;
            }
            hideTooltip();
        });
    }());
    </script>
</body>
</html>
