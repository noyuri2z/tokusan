<div class="mb-4 p-4 bg-green-50 rounded border border-green-200">
    <p class="text-green-800">
        <strong>CSVを読み込みました！</strong> {{ num_samples }}件のサンプル、ラベル：{{ unique_labels | join(', ') }}
    </p>
</div>

<form hx-post="/api/train"
      hx-target="#step3-content"
      hx-swap="innerHTML"
      class="space-y-4">
    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
            クラス名（カンマ or 読点区切り、ラベル順）
        </label>
        <input type="text" name="class_names" required
               value="{{ suggested_classes | join(', ') }}"
               placeholder="例：フェイク, 本物"
               class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-green-500 focus:border-green-500">
        <p class="text-sm text-gray-500 mt-1">
            例：ラベル0 = フェイク、ラベル1 = 本物 の場合、「フェイク, 本物」と入力
        </p>
    </div>

    <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
            分類器の種類
        </label>
        <select name="classifier_type"
                id="classifier-type-select"
                onchange="updateClassifierDesc(this.value)"
                class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-green-500 focus:border-green-500">
            <option value="logistic_regression" selected>ロジスティック回帰</option>
            <option value="random_forest">ランダムフォレスト</option>
            <option value="linear_svc">線形SVM</option>
            <option value="naive_bayes">ナイーブベイズ</option>
        </select>
        <p id="classifier-desc" class="text-sm text-gray-500 mt-1"></p>
    </div>

    <button type="submit"
            class="bg-green-600 text-white px-6 py-2 rounded hover:bg-green-700 transition inline-flex items-center">
        モデルを学習
        <svg class="htmx-indicator ml-2 animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
    </button>
</form>

<script>
    document.getElementById('step2-badge').className = 'bg-green-600 text-white rounded-full w-8 h-8 flex items-center justify-center mr-3 text-sm';

    const CLASSIFIER_DESCS = {
        logistic_regression: "線形モデル。高速で解釈しやすく、ほとんどのテキスト分類タスクに適しています。クラス間の境界が線形な場合に最も効果的です。",
        random_forest: "決定木のアンサンブル。非線形な関係を捉えられますが、学習に時間がかかります。高次元・疎なTF-IDF特徴量とは相性がやや悪い場合があります。",
        linear_svc: "線形サポートベクターマシン。高次元・疎なTF-IDF特徴量に非常に強く、テキスト分類で最も性能が出やすいモデルの一つです。確率推定にPlattスケーリングを使用します。",
        naive_bayes: "確率的な生成モデル。非常に高速で少量データでも機能します。単語の出現が独立という仮定があるため、複雑な文脈の分類には不向きな場合があります。",
    };
    function updateClassifierDesc(val) {
        document.getElementById('classifier-desc').textContent = CLASSIFIER_DESCS[val] || '';
    }
    updateClassifierDesc('logistic_regression');
</script>
