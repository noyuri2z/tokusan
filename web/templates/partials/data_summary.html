<div class="bg-green-50 border border-green-200 rounded-lg p-4">
    <p class="text-green-800 font-semibold mb-2">データを読み込みました！</p>
    <div class="text-sm text-gray-700 space-y-1">
        <p><span class="font-medium">サンプル数：</span>{{ num_samples }}件</p>
        <p><span class="font-medium">ラベル：</span>{{ unique_labels | join(', ') }}</p>
    </div>

    <div class="mt-4 pt-4 border-t border-green-200">
        <label class="block text-sm font-medium text-gray-700 mb-2">
            クラス名（カンマ or 読点区切り、ラベル順）
        </label>
        <input type="text" id="class-names-input"
               value="{{ suggested_classes | join(', ') }}"
               placeholder="例：フェイク, 本物"
               class="w-full px-3 py-2 border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500">
        <p class="text-xs text-gray-500 mt-1">
            例：ラベル0 = フェイク、ラベル1 = 本物 の場合、「フェイク, 本物」と入力
        </p>
    </div>
</div>
