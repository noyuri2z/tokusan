<div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mt-4">
    <h4 class="font-semibold text-blue-800 mb-2">{{ sample.title }}</h4>
    <p class="text-sm text-gray-700 mb-3">{{ sample.description }}</p>
    <div class="mb-3">
        <span class="text-xs font-medium text-gray-500">サンプル数：</span>
        <span class="text-sm font-medium">{{ sample.sample_count }}件</span>
    </div>
    {% if sample.suggested_classes %}
    <div class="mb-3">
        <span class="text-xs font-medium text-gray-500">クラス名：</span>
        <div class="flex flex-wrap gap-1 mt-1">
            {% for cls in sample.suggested_classes %}
            <span class="bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-xs">{{ cls }}</span>
            {% endfor %}
        </div>
    </div>
    {% endif %}
    <div class="bg-white bg-opacity-60 rounded p-3">
        <span class="text-xs font-medium text-gray-500">この分析でできること：</span>
        <p class="text-sm text-gray-700 mt-1">{{ sample.analysis_hint }}</p>
    </div>
</div>
